<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Mission Select Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&family=Kanit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --word-blue-dark: #1e40af;
      --word-blue-main: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
      --text-main: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    body {
      min-height: 100vh; background: var(--bg-gradient); font-family: 'Kanit', sans-serif;
      color: var(--text-main); display: flex; flex-direction: column; align-items: center;
      padding: 16px 14px 60px; position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: linear-gradient(to right, rgba(2, 132, 199, 0.12) 2px, transparent 2px),
                  linear-gradient(to bottom, rgba(2, 132, 199, 0.12) 2px, transparent 2px);
      background-size: 32px 32px; pointer-events: none; z-index: 0;
    }

    /* AUTH */
    #auth-screen {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px);
      display: flex; justify-content: center; align-items: center; padding: 16px; z-index: 200;
    }
    .arcade-auth-card {
      background: #ffffff; border: 4px solid var(--word-blue-main); border-radius: 28px;
      padding: 30px 24px; max-width: 420px; width: 100%; box-shadow: 0 10px 0 var(--word-blue-dark);
      text-align: center;
    }
    .brand-logo {
      font-family: 'Chakra Petch'; font-size: 2.2rem; font-weight: 900; color: var(--word-blue-main);
      text-shadow: 2px 2px 0 #bae6fd; margin-bottom: 14px;
    }
    .bright-input {
      width: 100%; padding: 13px 16px; border-radius: 14px; border: 3px solid #bae6fd;
      background: #f8fafc; font-family: 'Kanit'; font-size: 1rem; font-weight: 700; margin-bottom: 12px; outline: none;
    }
    .btn-green-3d {
      width: 100%; padding: 14px; border-radius: 16px; border: none;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #fff; font-family: 'Chakra Petch'; font-size: 1.2rem; font-weight: 900;
      cursor: pointer; box-shadow: 0 5px 0 #047857; transition: 0.1s;
    }
    .btn-green-3d:active { transform: translateY(3px); box-shadow: 0 2px 0 #047857; }

    /* HUB */
    #hub-screen { display: none; width: 100%; max-width: 1020px; flex-direction: column; gap: 18px; z-index: 1; }
    .hub-navbar {
      background: #ffffff; border: 3px solid var(--word-blue-main); border-radius: 20px;
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 6px 0 var(--word-blue-dark);
    }
    .coin-badge {
      background: #fef3c7; border: 2px solid #f59e0b; border-radius: 999px;
      padding: 6px 16px; display: flex; align-items: center; gap: 8px;
      font-family: 'Chakra Petch'; font-weight: 900; font-size: 1.15rem; color: #b45309;
      box-shadow: 0 3px 0 #d97706;
    }

    .banner-garage-group { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
    .hero-banner {
      background: #ffffff; border: 3px solid var(--word-blue-main); border-radius: 22px;
      padding: 20px 24px; box-shadow: 0 6px 0 var(--word-blue-dark); display: flex; align-items: center;
    }
    .garage-btn-card {
      background: linear-gradient(135deg, #1e293b, #0f172a); border: 3px solid #facc15;
      border-radius: 22px; padding: 18px; color: #fff; text-align: center;
      box-shadow: 0 6px 0 #b45309; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
    }

    .units-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
    .unit-card {
      background: #ffffff; border: 3px solid #bae6fd; border-radius: 20px; padding: 18px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px; box-shadow: 0 6px 0 #7dd3fc;
    }
    .unit-card.completed { border-color: #10b981; background: #f0fdf4; box-shadow: 0 6px 0 #047857; }
    .unit-card.locked { opacity: 0.6; background: #f8fafc; border-color: #cbd5e1; box-shadow: 0 6px 0 #94a3b8; }

    .btn-challenge {
      width: 100%; padding: 12px; border-radius: 14px; border: none;
      background: linear-gradient(180deg, #2563eb, #1d4ed8); color: #fff;
      font-family: 'Chakra Petch'; font-size: 1.1rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 0 #1e3a8a; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-challenge:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e3a8a; }

    @media (max-width: 640px) { .banner-garage-group { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- 1. AUTH SCREEN -->
  <div id="auth-screen">
    <div class="arcade-auth-card">
      <div class="brand-logo">WORD ROAD 3D</div>
      <p style="color:#64748b; font-weight:700; margin-bottom:16px;">เข้าสู่ระบบเพื่อเริ่มขับจักรยานด่านแรก</p>
      <input type="text" id="auth-name" class="bright-input" placeholder="พิมพ์ชื่อผู้เล่น..." />
      <button class="btn-green-3d" onclick="login()">เข้าโรงรถ & เริ่มซิ่ง</button>
    </div>
  </div>

  <!-- 2. HUB SCREEN -->
  <div id="hub-screen">
    <div class="hub-navbar">
      <div style="font-weight:900; font-size:1.15rem; color:var(--word-blue-main);" id="user-display">ผู้เล่น: -</div>
      <div class="coin-badge">
        <span>🪙</span>
        <span id="user-coins">0</span>
      </div>
    </div>

    <div class="banner-garage-group">
      <div class="hero-banner">
        <div>
          <h2 style="font-family:'Chakra Petch'; font-size:1.6rem; color:var(--word-blue-main);">ภารกิจซิ่งพิชิต WORD ม.1</h2>
          <p style="color:#64748b; font-weight:700; font-size:0.9rem;">ขับจักรยานทำภารกิจด่าน 1 เพื่อปลดล็อกรถคันใหม่ในด่านถัดไป!</p>
        </div>
      </div>
      <div class="garage-btn-card">
        <span style="font-size:2rem;" id="current-vehicle-icon">🚲</span>
        <div style="font-family:'Chakra Petch'; font-weight:900; font-size:1.05rem; color:#facc15;">ยานพาหนะปัจจุบัน</div>
        <div style="font-size:0.8rem; color:#cbd5e1;" id="current-vehicle-name">จักรยานเสือหมอบ</div>
      </div>
    </div>

    <!-- 12 Units -->
    <div class="units-grid" id="units-container"></div>
  </div>

  <script>
    const vehiclesTiers = {
      1: { name: "จักรยานเสือหมอบ (Bicycle)", icon: "🚲" },
      2: { name: "มอเตอร์ไซค์สกู๊ตเตอร์ (Scooter)", icon: "🛵" },
      3: { name: "รถเก๋งคลาสสิก (City Car)", icon: "🚗" },
      4: { name: "รถกระบะซิ่ง (Pickup Turbo)", icon: "🛻" },
      5: { name: "รถสปอร์ตเปิดประทุน (Roadster)", icon: "🏎️" },
      6: { name: "ซูเปอร์คาร์โกลด์ (Gold Supercar)", icon: "👑" }
    };

    const unitsList = [
      { id: 1, title: "บทที่ 1: ส่วนประกอบ Microsoft Word", reward: "ปลดล็อก: มอเตอร์ไซค์ 🛵" },
      { id: 2, title: "บทที่ 2: การจัดการไฟล์และคีย์ลัด", reward: "ปลดล็อก: รถเก๋ง 🚗" },
      { id: 3, title: "บทที่ 3: พิมพ์และจัดการข้อความ", reward: "ปลดล็อก: รถกระบะ 🛻" },
      { id: 4, title: "บทที่ 4: ตกแต่งฟอนต์และสไตล์", reward: "ปลดล็อก: รถสปอร์ต 🏎️" },
      { id: 5, title: "บทที่ 5: จัดแนวย่อหน้าและบรรทัด", reward: "ปลดล็อก: ซูเปอร์คาร์ 👑" },
      { id: 6, title: "บทที่ 6: หัวข้อย่อยและลำดับเลข", reward: "โบนัสเหรียญ +200🪙" },
      { id: 7, title: "บทที่ 7: แทรกรูปภาพ & Wrap Text", reward: "โบนัสเหรียญ +200🪙" },
      { id: 8, title: "บทที่ 8: สร้างและแต่งตาราง", reward: "โบนัสเหรียญ +200🪙" },
      { id: 9, title: "บทที่ 9: ตั้งค่าหน้ากระดาษ A4", reward: "โบนัสเหรียญ +200🪙" },
      { id: 10, title: "บทที่ 10: ตรวจสะกดและแทนที่คำ", reward: "โบนัสเหรียญ +200🪙" },
      { id: 11, title: "บทที่ 11: Style และสารบัญอัตโนมัติ", reward: "โบนัสเหรียญ +200🪙" },
      { id: 12, title: "บทที่ 12: ส่งออกไฟล์ PDF & สั่งพิมพ์", reward: "ถ้วยรางวัลชนะเลิศ 🏆" }
    ];

    let currentUser = { name: "Player1", coins: 0, unlockedUnit: 1 };

    function loadUserData() {
      const data = localStorage.getItem("word_road_player_save");
      if (data) currentUser = JSON.parse(data);
      updateUI();
    }

    function saveUserData() {
      localStorage.setItem("word_road_player_save", JSON.stringify(currentUser));
      updateUI();
    }

    function login() {
      const nameInput = document.getElementById("auth-name").value.trim();
      if (nameInput) currentUser.name = nameInput;
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("hub-screen").style.display = "flex";
      saveUserData();
    }

    function updateUI() {
      document.getElementById("user-display").innerText = `ผู้เล่น: ${currentUser.name}`;
      document.getElementById("user-coins").innerText = currentUser.coins;

      // หายานพาหนะตามด่านสูงสุดปัจจุบัน
      const tier = Math.min(currentUser.unlockedUnit, 6);
      const v = vehiclesTiers[tier] || vehiclesTiers[1];
      document.getElementById("current-vehicle-icon").innerText = v.icon;
      document.getElementById("current-vehicle-name").innerText = v.name;

      const grid = document.getElementById("units-container");
      grid.innerHTML = "";

      unitsList.forEach(u => {
        const isUnlocked = u.id <= currentUser.unlockedUnit;
        const isCompleted = u.id < currentUser.unlockedUnit;
        const card = document.createElement("div");
        card.className = `unit-card ${isCompleted ? 'completed' : (isUnlocked ? '' : 'locked')}`;

        card.innerHTML = `
          <div>
            <div style="font-family:'Chakra Petch'; font-weight:800; font-size:0.85rem; color:#0284c7;">STAGE ${u.id.toString().padStart(2, '0')}</div>
            <div style="font-weight:800; font-size:1.05rem; margin:4px 0;">${u.title}</div>
            <div style="font-size:0.8rem; color:#eab308; font-weight:800;">🎁 ${u.reward}</div>
          </div>
          <button class="btn-challenge" ${isUnlocked ? `onclick="playStage(${u.id})"` : 'disabled'} style="${!isUnlocked ? 'background:#cbd5e1; box-shadow:none; cursor:not-allowed;' : ''}">
            <span>${isCompleted ? 'ซิ่งท้าทายซ้ำ 🏁' : (isUnlocked ? 'ลงสนามซิ่งเลย! 🚀' : '🔒 ล็อกอยู่')}</span>
          </button>
        `;
        grid.appendChild(card);
      });
    }

    // กดแล้วพาไปหน้าสนาม 3D ของด่านนั้นทันที ไม่ต้องมีข้อสอบ Popup คั่น
    function playStage(stageNum) {
      window.location.href = `game.html?stage=${stageNum}`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadUserData();
    });
  </script>
</body>
</html>
