<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Pure Arcade Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800;900&family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #38bdf8; position: fixed; inset: 0; font-family: 'Kanit', sans-serif; }
    #three-container { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* MISSION HUD ด้านบน */
    #mission-hud {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
      border: 3px solid #38bdf8; border-radius: 24px; padding: 10px 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: #fff; z-index: 45; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      min-width: 320px; text-align: center;
    }
    .mission-title { font-size: 0.82rem; font-weight: 800; color: #facc15; letter-spacing: 0.5px; }
    .mission-desc { font-size: 1.15rem; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }

    /* SCORE & COIN HUD */
    #stat-hud {
      position: fixed; top: 16px; right: 16px;
      display: flex; gap: 10px; z-index: 50;
    }
    .hud-chip {
      background: rgba(15, 23, 42, 0.88); border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px; padding: 6px 16px; display: flex; align-items: center; gap: 8px;
      font-family: 'Chakra Petch'; font-size: 1.15rem; font-weight: 900; color: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }

    /* SPEEDOMETER & NITRO */
    #speedo-box {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 50; pointer-events: none;
    }
    .speed-number {
      font-family: 'Chakra Petch'; font-size: 3rem; font-weight: 900;
      color: #facc15; text-shadow: 0 0 12px rgba(250, 204, 21, 0.5); line-height: 1;
    }
    .speed-unit { font-size: 0.85rem; font-weight: 800; color: #94a3b8; }
    .nitro-alert {
      background: #ef4444; color: #fff; font-family: 'Chakra Petch'; font-weight: 900;
      font-size: 0.95rem; padding: 4px 14px; border-radius: 999px; margin-top: 4px;
      animation: pulse 0.4s infinite alternate; display: none;
    }
    @keyframes pulse { from { opacity: 0.6; transform: scale(0.95); } to { opacity: 1; transform: scale(1.05); } }

    /* TOUCH CONTROLS */
    #mobile-controls {
      position: fixed; bottom: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 28px;
      pointer-events: none; z-index: 60;
    }
    .pad-cluster { pointer-events: auto; display: flex; gap: 12px; }
    .v-btn {
      width: 76px; height: 76px; border-radius: 24px; background: rgba(15, 23, 42, 0.82);
      border: 3px solid rgba(255, 255, 255, 0.3); display: flex; justify-content: center;
      align-items: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .v-btn:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.4); border-color: #38bdf8; }
    .v-btn svg { width: 36px; height: 36px; fill: #ffffff; }

    /* FLOATING NOTIFICATION */
    #action-toast {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Chakra Petch'; font-size: 2.2rem; font-weight: 900;
      color: #4ade80; text-shadow: 0 0 20px #22c55e, 0 4px 0 #000;
      pointer-events: none; z-index: 100; opacity: 0; transition: all 0.25s;
    }
  </style>
</head>
<body>

  <div id="three-container"></div>

  <!-- MISSION HUD -->
  <div id="mission-hud">
    <div class="mission-title" id="m-stage">🎯 ภารกิจที่ 1 / 10</div>
    <div class="mission-desc" id="m-text">ซิ่งพุ่งชน: ไอคอนบันทึกงาน (SAVE)</div>
  </div>

  <!-- STATS -->
  <div id="stat-hud">
    <div class="hud-chip" style="border-color:#f59e0b; color:#fde047;">
      <span>🪙</span>
      <span id="stat-coins">0</span>
    </div>
    <div class="hud-chip" style="border-color:#10b981; color:#6ee7b7;">
      <span>PTS</span>
      <span id="stat-pts">0</span>
    </div>
  </div>

  <!-- SPEEDO -->
  <div id="speedo-box">
    <div class="speed-number" id="speed-val">0</div>
    <div class="speed-unit">KM/H</div>
    <div class="nitro-alert" id="nitro-tag">⚡ NITRO BOOST ⚡</div>
  </div>

  <div id="action-toast">PERFECT HIT! +100 PTS</div>

  <!-- TOUCH BUTTONS -->
  <div id="mobile-controls">
    <div class="pad-cluster">
      <div class="v-btn" id="btn-left">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </div>
      <div class="v-btn" id="btn-right">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </div>
    </div>
    <div class="pad-cluster">
      <div class="v-btn" id="btn-down" style="border-color:#ef4444; background:rgba(239, 68, 68, 0.25);">
        <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
      </div>
      <div class="v-btn" id="btn-up" style="border-color:#10b981; background:rgba(16, 185, 129, 0.35); width:82px; height:82px;">
        <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, carGroup;
    let coins = [], targetSigns = [], obstacles = [];
    let score = 0, coinCount = 0, currentMissionIdx = 0;
    let keys = { up: false, down: false, left: false, right: false };

    let carPhysics = {
      x: 0, z: 0, angle: 0,
      speed: 0, baseMaxSpeed: 1.6, currentMaxSpeed: 1.6,
      accel: 0.045, friction: 0.016, turnSpeed: 0.042,
      boostTimer: 0
    };

    // ภารกิจซิ่งเก็บป้ายไอคอนบนถนน (ไม่มี Popup มาคั่น)
    const missionList = [
      {
        zPos: -300,
        prompt: "ซิ่งพุ่งชน: ป้ายบันทึกเอกสาร [Ctrl + S]",
        targetType: "save",
        cards: [
          { type: "save", text: "Ctrl + S", color: 0x10b981, lane: -8 },
          { type: "copy", text: "Ctrl + C", color: 0xef4444, lane: 0 },
          { type: "cut", text: "Ctrl + X", color: 0xef4444, lane: 8 }
        ]
      },
      {
        zPos: -700,
        prompt: "ซิ่งพุ่งชน: เครื่องมือทำตัวอักษรหนา [Bold]",
        targetType: "bold",
        cards: [
          { type: "italic", text: "Italic (I)", color: 0xef4444, lane: -8 },
          { type: "bold", text: "Bold (B)", color: 0x10b981, lane: 0 },
          { type: "underline", text: "Underline", color: 0xef4444, lane: 8 }
        ]
      },
      {
        zPos: -1100,
        prompt: "ซิ่งพุ่งชน: คีย์ลัดย้อนกลับคำสั่ง [Undo]",
        targetType: "undo",
        cards: [
          { type: "redo", text: "Ctrl + Y", color: 0xef4444, lane: -8 },
          { type: "paste", text: "Ctrl + V", color: 0xef4444, lane: 0 },
          { type: "undo", text: "Ctrl + Z", color: 0x10b981, lane: 8 }
        ]
      },
      {
        zPos: -1500,
        prompt: "ซิ่งพุ่งชน: จัดข้อความกึ่งกลางหน้ากระดาษ",
        targetType: "center",
        cards: [
          { type: "center", text: "Ctrl + E (Center)", color: 0x10b981, lane: -8 },
          { type: "left", text: "Ctrl + L (Left)", color: 0xef4444, lane: 0 },
          { type: "right", text: "Ctrl + R (Right)", color: 0xef4444, lane: 8 }
        ]
      },
      {
        zPos: -1900,
        prompt: "ซิ่งพุ่งชน: สกุลไฟล์ล็อกหน้ากระดาษไม่ให้เคลื่อน",
        targetType: "pdf",
        cards: [
          { type: "docx", text: ".DOCX", color: 0xef4444, lane: -8 },
          { type: "pdf", text: ".PDF", color: 0x10b981, lane: 0 },
          { type: "txt", text: ".TXT", color: 0xef4444, lane: 8 }
        ]
      }
    ];

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.Fog(0x38bdf8, 90, 600);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById("three-container").appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x334155, 0.95);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xfffbeb, 0.85);
      sun.position.set(50, 100, 50);
      scene.add(sun);

      buildTrack();
      buildCar();
      buildItems();
      setupInput();
      updateMissionHUD();
      animate();
    }

    function buildTrack() {
      // พื้นหญ้า
      const grassGeo = new THREE.PlaneGeometry(600, 3200);
      const grassMat = new THREE.MeshLambertMaterial({ color: 0x22c55e });
      const grass = new THREE.Mesh(grassGeo, grassMat);
      grass.rotation.x = -Math.PI / 2;
      grass.position.z = -1200;
      scene.add(grass);

      // ถนน 3 เลนกว้างพิเศษ
      const roadGeo = new THREE.PlaneGeometry(36, 3000);
      const roadMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.set(0, 0.05, -1200);
      scene.add(road);

      // เส้นแบ่งเลน
      for (let z = 50; z > -2600; z -= 14) {
        const lineGeo = new THREE.PlaneGeometry(0.5, 6);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const l1 = new THREE.Mesh(lineGeo, lineMat);
        l1.rotation.x = -Math.PI / 2;
        l1.position.set(-6, 0.08, z);
        scene.add(l1);

        const l2 = l1.clone();
        l2.position.x = 6;
        scene.add(l2);
      }
    }

    function buildCar() {
      carGroup = new THREE.Group();

      // สกินรถ Supercar
      const bodyGeo = new THREE.BoxGeometry(3.6, 1.25, 7.2);
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xef4444 }); // สีแดงสปอร์ต
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.95;
      carGroup.add(body);

      const roofGeo = new THREE.BoxGeometry(2.9, 1.0, 3.6);
      const roofMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(0, 1.9, -0.4);
      carGroup.add(roof);

      // สปอยเลอร์หลัง
      const spoilerBar = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.3, 0.8), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      spoilerBar.position.set(0, 2.1, 3.1);
      carGroup.add(spoilerBar);

      scene.add(carGroup);
    }

    function createSignBoard(text, bgColor) {
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = bgColor;
      ctx.roundRect(0, 0, 256, 128, 20);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 32px Kanit, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
      const geo = new THREE.PlaneGeometry(6.5, 3.5);
      return new THREE.Mesh(geo, mat);
    }

    function buildItems() {
      // 1. วางเหรียญทองตามทาง
      for (let z = -40; z > -2500; z -= 30) {
        const lane = [-8, 0, 8][Math.floor(Math.random() * 3)];
        const coinGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 16);
        const coinMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(lane, 1.4, z);
        scene.add(coin);
        coins.push({ mesh: coin, x: lane, z: z, hit: false });
      }

      // 2. วางป้ายภารกิจ 3 ป้ายเรียงหน้ากระดาน 3 เลน
      missionList.forEach(m => {
        m.cards.forEach(c => {
          const signMesh = createSignBoard(c.text, c.color === 0x10b981 ? "#059669" : "#dc2626");
          signMesh.position.set(c.lane, 2.2, m.zPos);
          scene.add(signMesh);
          targetSigns.push({
            mesh: signMesh, x: c.lane, z: m.zPos,
            isTarget: c.type === m.targetType,
            hit: false
          });
        });
      });

      // 3. สิ่งกีดขวาง (กรวยจราจร)
      for (let z = -90; z > -2400; z -= 65) {
        const lane = [-4, 4][Math.floor(Math.random() * 2)];
        const coneGeo = new THREE.ConeGeometry(1.0, 2.5, 8);
        const coneMat = new THREE.MeshLambertMaterial({ color: 0xea580c });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.position.set(lane, 1.2, z);
        scene.add(cone);
        obstacles.push({ mesh: cone, x: lane, z: z, hit: false });
      }
    }

    function setupInput() {
      window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = true;
        if (k === "arrowdown" || k === "s") keys.down = true;
        if (k === "arrowleft" || k === "a") keys.left = true;
        if (k === "arrowright" || k === "d") keys.right = true;
      });
      window.addEventListener("keyup", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = false;
        if (k === "arrowdown" || k === "s") keys.down = false;
        if (k === "arrowleft" || k === "a") keys.left = false;
        if (k === "arrowright" || k === "d") keys.right = false;
      });

      const bindBtn = (id, act) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[act] = true; });
        el.addEventListener("touchend", () => keys[act] = false);
      };
      bindBtn("btn-up", "up");
      bindBtn("btn-down", "down");
      bindBtn("btn-left", "left");
      bindBtn("btn-right", "right");
    }

    function showToast(text, color) {
      const toast = document.getElementById("action-toast");
      toast.innerText = text;
      toast.style.color = color;
      toast.style.opacity = "1";
      toast.style.transform = "translate(-50%, -60%) scale(1.15)";
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translate(-50%, -50%) scale(1)";
      }, 750);
    }

    function updateMissionHUD() {
      if (currentMissionIdx < missionList.length) {
        document.getElementById("m-stage").innerText = `🎯 ภารกิจที่ ${currentMissionIdx + 1} / ${missionList.length}`;
        document.getElementById("m-text").innerText = missionList[currentMissionIdx].prompt;
      } else {
        document.getElementById("m-stage").innerText = "🏆 CHAMPION!";
        document.getElementById("m-text").innerText = "คุณพิชิตทุกภารกิจ Word Road สำเร็จแล้ว!";
      }
    }

    function updatePhysics() {
      // ควบคุมการขับ
      if (keys.up) carPhysics.speed += carPhysics.accel;
      else if (keys.down) carPhysics.speed -= carPhysics.accel * 1.5;
      else {
        if (carPhysics.speed > 0) carPhysics.speed = Math.max(0, carPhysics.speed - carPhysics.friction);
        if (carPhysics.speed < 0) carPhysics.speed = Math.min(0, carPhysics.speed + carPhysics.friction);
      }

      // ระบบเทอร์โบไนตรัส
      if (carPhysics.boostTimer > 0) {
        carPhysics.boostTimer--;
        carPhysics.currentMaxSpeed = carPhysics.baseMaxSpeed * 1.5;
        document.getElementById("nitro-tag").style.display = "block";
      } else {
        carPhysics.currentMaxSpeed = carPhysics.baseMaxSpeed;
        document.getElementById("nitro-tag").style.display = "none";
      }

      carPhysics.speed = Math.max(-0.4, Math.min(carPhysics.speed, carPhysics.currentMaxSpeed));

      if (carPhysics.speed !== 0) {
        const dir = carPhysics.speed > 0 ? 1 : -1;
        if (keys.left) carPhysics.angle += carPhysics.turnSpeed * dir;
        if (keys.right) carPhysics.angle -= carPhysics.turnSpeed * dir;
      }

      carPhysics.x -= Math.sin(carPhysics.angle) * carPhysics.speed;
      carPhysics.z -= Math.cos(carPhysics.angle) * carPhysics.speed;
      carPhysics.x = Math.max(-14, Math.min(14, carPhysics.x));

      // 1. ขับชนเก็บเหรียญ
      coins.forEach(c => {
        if (!c.hit && Math.hypot(carPhysics.x - c.x, carPhysics.z - c.z) < 2.5) {
          c.hit = true;
          scene.remove(c.mesh);
          coinCount += 5;
          score += 10;
          document.getElementById("stat-coins").innerText = coinCount;
          document.getElementById("stat-pts").innerText = score;
        }
      });

      // 2. ขับชนป้ายภารกิจ
      targetSigns.forEach(s => {
        if (!s.hit && Math.hypot(carPhysics.x - s.x, carPhysics.z - s.z) < 3.2) {
          s.hit = true;
          scene.remove(s.mesh);

          if (s.isTarget) {
            // ชนถูกป้าย: เร่งเทอร์โบ + คะแนนพุ่ง
            score += 100;
            coinCount += 25;
            carPhysics.boostTimer = 90; // พุ่งเร็ว 90 เฟรม
            showToast("PERFECT HIT! ⚡ NITRO BOOST", "#4ade80");
            currentMissionIdx++;
            updateMissionHUD();
          } else {
            // ชนผิดป้าย: ความเร็วตก
            carPhysics.speed *= 0.35;
            showToast("WRONG TARGET! SPEED DOWN", "#ef4444");
          }
          document.getElementById("stat-coins").innerText = coinCount;
          document.getElementById("stat-pts").innerText = score;
        }
      });

      // 3. ขับชนสิ่งกีดขวาง
      obstacles.forEach(ob => {
        if (!ob.hit && Math.hypot(carPhysics.x - ob.x, carPhysics.z - ob.z) < 2.0) {
          ob.hit = true;
          carPhysics.speed *= 0.3;
          showToast("CRASH!", "#f97316");
        }
      });

      // อัปเดตรถ & มุมกล้อง
      carGroup.position.set(carPhysics.x, 0, carPhysics.z);
      carGroup.rotation.y = carPhysics.angle;

      camera.position.set(carPhysics.x, 5.8, carPhysics.z + 13.5);
      camera.lookAt(carPhysics.x, 1.8, carPhysics.z - 8.0);

      // อัปเดตความเร็ว KM/H
      const speedKMH = Math.round(Math.abs(carPhysics.speed) * 90);
      document.getElementById("speed-val").innerText = speedKMH;
    }

    function animate() {
      requestAnimationFrame(animate);
      updatePhysics();
      coins.forEach(c => { if (!c.hit) c.mesh.rotation.z += 0.05; });
      renderer.render(scene, camera);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
