const THEMES = {

  10:{n:"เมืองนีออนยามค่ำคืน",sky:[0x0b1026,0x3b2a7a],gnd:0x1e1b4b,hill:[0x312e81,0x4c1d95,0x1e3a8a],hs:"cone",road:0x1f2937,curb:[0x22d3ee,0xec4899],wall:[0x8b5cf6,0x22d3ee],near:"neon",far:"tower",fc:[0x22d3ee,0xec4899,0xa78bfa],night:true},
  11:{n:"เกาะลอยฟ้า",sky:[0x60a5fa,0xffffff],gnd:0xf8fafc,hill:[0xffffff,0xe0f2fe,0xfce7f3],hs:"sphere",road:0x64748b,curb:[0xfacc15,0xffffff],wall:[0xa78bfa,0xffffff],near:"tree",far:"blob",fc:[0xffffff,0xfce7f3,0xe0f2fe]},

};
const TH = THEMES[stageId] || THEMES[1];

const SHAPES = [
  [[0,60],[0,-150],[50,-280],[170,-340],[300,-300],[340,-180],[290,-80],[190,-60],[120,20],[60,90]],
  [[0,60],[0,-200],[60,-330],[210,-380],[350,-320],[400,-190],[350,-100],[350,-10],[400,80],[260,160],[100,130]],

];
const HW = 16;
const $ = id => document.getElementById(id);
const gm = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.LuminanceFormat);
gm.minFilter = gm.magFilter = THREE.NearestFilter; gm.needsUpdate = true;
const toon = (c, o) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: gm }, o));
let sky, clouds;

const TOTAL_LAPS = 5, BONUS_SEC = 30;
let raceF = 0, bonus = null, acc = 0, lastT = 0, lastBonusLap = 0;
let isCountingDown = true, countdownTimer = 3;

const fmt = t => { const ms = Math.round(t * 1000); return String(Math.floor(ms / 60000)).padStart(2, "0") + ":" + String(Math.floor(ms / 1000) % 60).padStart(2, "0") + "." + String(ms % 1000).padStart(3, "0"); };

// ปรับความเร็ว AI ให้อยู่ระดับ 52% - 64% ของผู้เล่น ขับแซงได้ง่าย
const RATIO = [0.64, 0.58, 0.60, 0.55, 0.52], SKILL = [.85, .7, .6, .8, .45];
const SPH = new THREE.SphereGeometry(1, 14, 10);
const mk = (g, geo, c, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, em) => { const m = new THREE.Mesh(geo, toon(c, em ? { emissive: em } : undefined)); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true; g.add(m); return m; };

let scene, camera, renderer, sun, car, camAngle = 0, frame = 0;
let items = [], signs = [], ais = [], skids = [], parts = [];
let isCleared = false, skidI = 0, partI = 0;
const keys = { up:false, down:false, left:false, right:false };

const MIR = stageId >= 5 && stageId <= 8 ? -1 : 1, SC = stageId >= 9 ? 1.2 : 1;
const curve = new THREE.CatmullRomCurve3(
  SHAPES[(stageId - 1) % 4].map(p => new THREE.Vector3(MIR * p[0] * SC, 0, p[1] * SC)), true, 'catmullrom', 0.5);
const N = 600;
const pts = curve.getSpacedPoints(N).slice(0, N);
const SP = curve.getLength() / N;
const tan = pts.map((p,i) => { const a = pts[(i+1)%N], b = pts[(i+N-1)%N]; return new THREE.Vector3(a.x-b.x,0,a.z-b.z).normalize(); });
const rgt = tan.map(t => new THREE.Vector3(-t.z, 0, t.x));
const mod = i => ((i % N) + N) % N;
let _x0 = 1e9, _x1 = -1e9, _z0 = 1e9, _z1 = -1e9;
pts.forEach(p => { _x0 = Math.min(_x0, p.x); _x1 = Math.max(_x1, p.x); _z0 = Math.min(_z0, p.z); _z1 = Math.max(_z1, p.z); });

/* ---------- WEB AUDIO SYSTEM (COUNTDOWN & NITRO SFX) ---------- */
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function unlockAudioManual() {
  getAudioContext();
}

function playBeepLow() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch(e) {}
}

function playBeepHigh() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046.5, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.28, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.6);
  } catch(e) {}
}

function playNitroSound() {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const oscGain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, now);
    osc.frequency.exponentialRampToValueAtTime(800, now + 0.35);
    osc.frequency.exponentialRampToValueAtTime(300, now + 1.2);

    oscGain.gain.setValueAtTime(0.22, now);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(450, now);
    filter.frequency.exponentialRampToValueAtTime(1200, now + 0.35);

    osc.connect(filter);
    filter.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 1.2);

    const bufferSize = ctx.sampleRate * 0.8;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const whiteNoise = ctx.createBufferSource();
    whiteNoise.buffer = noiseBuffer;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "highpass";
    noiseFilter.frequency.setValueAtTime(1000, now);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.16, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

    whiteNoise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    whiteNoise.start(now);
    whiteNoise.stop(now + 0.8);
  } catch(e) {}
}

/* ---------- START COUNTDOWN SEQUENCE (3.. 2.. 1.. GO!) ---------- */
function startCountdown() {
  isCountingDown = true;
  countdownTimer = 3;
  $("countdown-screen").style.display = "flex";
  $("lamp-1").className = "cd-lamp red";
  $("lamp-2").className = "cd-lamp red";
  $("lamp-3").className = "cd-lamp red";
  $("cd-text").innerText = "3";
  $("cd-text").style.color = "#facc15";

  playBeepLow();

  const cdInterval = setInterval(() => {
    countdownTimer--;
    if (countdownTimer === 2) {
      $("cd-text").innerText = "2";
      $("lamp-3").className = "cd-lamp";
      playBeepLow();
    } else if (countdownTimer === 1) {
      $("cd-text").innerText = "1";
      $("lamp-2").className = "cd-lamp";
      playBeepLow();
    } else if (countdownTimer === 0) {
      $("cd-text").innerText = "GO! 🏁";
      $("cd-text").style.color = "#4ade80";
      $("lamp-1").className = "cd-lamp green";
      $("lamp-2").className = "cd-lamp green";
      $("lamp-3").className = "cd-lamp green";
      isCountingDown = false;
      playBeepHigh();
      showToast("START RACE! 🏁", "#facc15");
    } else {
      clearInterval(cdInterval);
      $("countdown-screen").style.display = "none";
    }
  }, 1000);
}

function strip(a, ya, b, yb, col) {

    [[i,a,ya],[j,a,ya],[i,b,yb],[j,a,ya],[j,b,yb],[i,b,yb]].forEach(([k,o,y]) => {
      pos.push(pts[k].x + rgt[k].x * o, y, pts[k].z + rgt[k].z * o); cl.push(c.r, c.g, c.b);

function buildScenery() {
  const at = (i, off) => [pts[i].x + rgt[i].x * off, pts[i].z + rgt[i].z * off];
  for (let i = 0; i < N; i += 13) for (const sd of [-1, 1]) {

    let ok = true;
    for (let k = 0; k < N; k += 6) if ((pts[k].x - x) ** 2 + (pts[k].z - z) ** 2 < 52 * 52) { ok = false; break; }
    if (!ok) continue;
    const g = farProp(TH.far, TH.fc); g.position.set(x, 0, z); scene.add(g);
  }
  for (let i = 4; i < N; i += 11) for (const sd of [-1, 1]) {

    const [x, z] = at(i, sd * (27 + Math.random() * 8)), g = nearProp(TH.near); g.position.set(x, 0, z); scene.add(g);
  }
}

    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex })); sp.scale.set(2.2, 2.2, 1); sp.position.y = 2.6; m.add(sp);
    m.position.set(px, 2, pz); m.castShadow = true; scene.add(m);
    items.push({ m, x: px, z: pz, hit: false });
  }
}

function useN2O() {
  getAudioContext();
  if (P.gauge < 50) { showToast("N2O ว่าง! ทำภารกิจผ่านด่านเพื่อรับ", "#f59e0b"); return; }
  if (P.boost < 10) { 
    P.gauge -= 50; 
    P.boost = 80; 
    playNitroSound();
    showToast("N2O BOOST! ⚡", "#38bdf8"); 
  }
}

function setupInputs() {
  const map = { ArrowUp:"up", KeyW:"up", ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right" };
  const n2o = ["KeyS","ArrowDown","Space","ShiftLeft","ShiftRight"];
  addEventListener("keydown", e => {
    getAudioContext();
    if (map[e.code]) { keys[map[e.code]] = true; e.preventDefault(); }
    if (e.code === "Enter") bonusEnter();
    if (n2o.includes(e.code)) { e.preventDefault(); if (!e.repeat) useN2O(); }
  });
  addEventListener("keyup", e => { if (map[e.code]) keys[map[e.code]] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
  addEventListener("pointerdown", () => { getAudioContext(); window.focus(); });
  const bind = (id, on, off) => {
    const el = $(id);
    ["touchstart","mousedown"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); getAudioContext(); on(); }));
    ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev => el.addEventListener(ev, off));
  };
  [["btn-up","up"],["btn-down","down"],["btn-left","left"],["btn-right","right"]].forEach(([id, a]) => bind(id, () => keys[a] = true, () => keys[a] = false));
  bind("btn-n2o", useN2O, () => {});
}

function showToast(text, color) {
  const t = $("toast-msg"); t.innerText = text; t.style.color = color; t.style.opacity = "1";
  clearTimeout(showToast.h); showToast.h = setTimeout(() => t.style.opacity = "0", 800);
}

function puff(x, z, col) {
  const p = parts[partI++ % parts.length]; p.m.position.set(x, .8, z); p.m.material.color.set(col); p.l = 26; p.vy = .04 + Math.random() * .04; p.m.visible = true;
}

function update() {
  if (isCleared) return;
  if (isCountingDown) return;
  if (bonus) { tickBonus(); return; }
  
  frame++; raceF++;
  let max = P.baseMax;
  if (P.boost > 0) { P.boost--; max *= 1.48; P.speed = Math.min(max, P.speed + .08); }
  $("nitro-alert").style.display = P.boost > 0 ? "block" : "none";

  if (keys.up) P.speed += P.accel;
  else if (keys.down) P.speed -= P.accel * 1.5;
  else { P.speed = P.speed > 0 ? Math.max(0, P.speed - P.friction) : Math.min(0, P.speed + P.friction); }
  P.speed = Math.max(-0.35, Math.min(P.speed, max));
  const sgn = P.speed >= 0 ? 1 : -1, turnIn = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);

  if (!P.drift) {
    if (turnIn && P.speed > P.baseMax * .7) { if (++P.hold > 10) { P.drift = turnIn; P.charge = 0; showToast("DRIFT!", "#facc15"); } } else P.hold = 0;
  } else if (!turnIn || P.speed < P.baseMax * .5) {
    if (P.charge > 35) { 
      P.boost = Math.min(110, 40 + P.charge * .6); 
      playNitroSound();
      showToast("DRIFT BOOST! ⚡", "#38bdf8"); 
    }
    P.drift = 0; P.charge = 0; P.hold = 0;
  } else P.charge++;

  if (P.speed !== 0) P.angle += P.turn * (P.drift ? (turnIn === P.drift ? 1.35 : .6) : 1) * turnIn * sgn;
  const fx = -Math.sin(P.angle), fz = -Math.cos(P.angle), grip = P.drift ? .07 : .22;
  P.vx += (fx * P.speed - P.vx) * grip; P.vz += (fz * P.speed - P.vz) * grip;
  P.x += P.vx; P.z += P.vz;

  let best = P.idx, bd = 1e9;
  for (let k = -14; k <= 14; k++) { const i = mod(P.idx + k), dx = P.x - pts[i].x, dz = P.z - pts[i].z, d = dx*dx + dz*dz; if (d < bd) { bd = d; best = i; } }
  
  if (P.idx > N * .75 && best < N * .25) {
    P.lap++;
  } else if (P.idx < N * .25 && best > N * .75) {
    P.lap--;
  }
  P.idx = best;

  const off = (P.x - pts[best].x) * rgt[best].x + (P.z - pts[best].z) * rgt[best].z, lim = HW + 1.3;
  if (Math.abs(off) > lim) {
    const s = Math.sign(off), push = off - s * lim;
    P.x -= rgt[best].x * push; P.z -= rgt[best].z * push; P.speed *= .94; P.vx *= .94; P.vz *= .94;
    if (frame % 3 === 0) puff(P.x + rgt[best].x * s * 2, P.z + rgt[best].z * s * 2, 0xfde047);
  }

  items.forEach(it => {
    if (it.cd > 0) { if (--it.cd === 0) { it.hit = false; it.m.visible = true; } return; }
    if (Math.hypot(P.x - it.x, P.z - it.z) < 3.4) {
      it.hit = true; it.m.visible = false; it.cd = 480; P.speed *= .3; P.vx *= .3; P.vz *= .3; P.drift = 0; P.boost = 0;
      showToast("ชนสิ่งกีดขวาง! 💥", "#ef4444"); for (let k = 0; k < 4; k++) puff(it.x, it.z, 0xfacc15);
    }
  });

  // ทำภารกิจทุกรอบที่เข้าเส้นชัย (รอบที่ 1, 2, 3, 4)
  if (P.lap > lastBonusLap && P.lap < TOTAL_LAPS) {
    lastBonusLap = P.lap;
    startBonus();
    return;
  }

  if (P.lap >= TOTAL_LAPS) { finishRace(); return; }

  P.steer += (turnIn - P.steer) * .25;
  car.position.set(P.x, .2, P.z); car.rotation.y = P.angle; car.rotation.z = turnIn * .07;
  car.userData.wheels.forEach(w => w.rotation.x -= P.speed * 1.5);
  car.userData.front.forEach(w => w.rotation.y = P.steer * .45);
  car.userData.flame.forEach(f => { f.visible = P.boost > 0; f.scale.set(1, .8 + Math.random() * .6, 1); });
  const co = Math.cos(P.angle), si = Math.sin(P.angle);
  if (P.drift || P.boost > 0) [-1.9, 1.9].forEach(lx => {
    const wx = P.x + lx * co + 1.7 * si, wz = P.z - lx * si + 1.7 * co;
    if (P.drift && frame % 2 === 0) { const m = skids[skidI++ % skids.length]; m.position.set(wx, .3, wz); m.rotation.y = P.angle; m.visible = true; }
    if (frame % 3 === 0) puff(wx, wz, P.boost > 0 ? 0x7dd3fc : 0xe5e7eb);
  });
  parts.forEach(p => { if (p.l > 0) { p.l--; p.m.position.y += p.vy; p.m.scale.setScalar(1 + (26 - p.l) * .09); p.m.material.opacity = p.l / 26 * .55; if (!p.l) p.m.visible = false; } });

  ais.forEach((a, i) => {
    stepAI(a); a.k.userData.flame.forEach(fl => fl.visible = a.bt > 0); const k = Math.floor(a.s), f = a.s - k, A = pts[mod(k)], B = pts[mod(k + 1)], R = rgt[mod(k)], T = tan[mod(k)];
    const ln = a.lane + Math.sin(frame * .02 + i * 2) * 2;
    a.k.position.set(A.x + (B.x - A.x) * f + R.x * ln, .2, A.z + (B.z - A.z) * f + R.z * ln);
    a.k.rotation.y = Math.atan2(-T.x, -T.z);
    a.k.userData.wheels.forEach(w => w.rotation.x -= a.sp * 1.5);
  });

  camAngle += (P.angle - camAngle) * .12;
  const cs = Math.sin(camAngle), cc = Math.cos(camAngle), shake = P.boost > 0 ? (Math.random() - .5) * .25 : 0;
  camera.position.set(P.x + cs * 11.5 + shake, 4.8 + (P.boost > 0 ? .6 : 0), P.z + cc * 11.5);
  camera.lookAt(P.x - cs * 9, 1.6, P.z - cc * 9);
  camera.fov += (65 + Math.abs(P.speed) / P.baseMax * 6 + (P.boost > 0 ? 12 : 0) - camera.fov) * .1; camera.updateProjectionMatrix();
  sun.position.set(P.x + 70, 140, P.z + 70); sun.target.position.set(P.x, 0, P.z);
  sky.position.copy(camera.position); clouds.position.set(P.x * .85, 0, P.z * .85); clouds.rotation.y += .0004;

  $("speed-val").innerText = Math.round(Math.hypot(P.vx, P.vz) * 68);
  const gf = $("gauge-fill"); gf.style.width = P.gauge + "%"; gf.style.background = P.gauge >= 50 ? "#38bdf8" : "#facc15";
  $("time-val").innerText = fmt(raceF / 60); $("stat-lap").innerText = Math.min(P.lap + 1, TOTAL_LAPS) + "/" + TOTAL_LAPS;
  if (frame % 6 === 0) drawRank();
  if (frame % 3 === 0) drawMap();
}

function stepAI(a) {
  if (isCountingDown || bonus) return; // ล็อกรถคู่แข่งให้อยู่กับที่ระหว่างโบนัสไทม์
  if (a.bt > 0) a.bt--;
  else if (a.n2o > 0 && Math.random() < .003) { a.bt = 80; a.n2o--; }
  a.s += a.sp * (1 + Math.sin(raceF * .01 + a.i * 2) * .015) * (a.bt > 0 ? 1.35 : 1) / SP;
  if (a.fin == null && a.s - a.s0 >= TOTAL_LAPS * N) a.fin = raceF / 60;
}

function finishRace() {
  isCleared = true; P.fin = raceF / 60; showToast("FINISH! 🏁", "#facc15");
  let g = 0; while (ais.some(a => a.fin == null) && g++ < 400000) { raceF++; ais.forEach(stepAI); }
  setTimeout(showResult, 1300);
}

function showResult() {
  const L = [{ n: "คุณ", t: P.fin, me: 1 }, ...ais.map(a => ({ n: a.name, t: a.fin }))].sort((a, b) => a.t - b.t);
  $("res-list").innerHTML = L.map((r, i) => `<div class="rrow${r.me ? " me" : ""}"><b>${["🥇", "🥈", "🥉"][i] || i + 1}</b>${r.n}<span class="t">${fmt(r.t)}</span></div>`).join("");
  const place = L.findIndex(r => r.me), reward = [150, 100, 70][place] || 40;
  $("res-title").innerText = place === 0 ? "คุณชนะ! 🏆" : `เข้าเส้นชัยอันดับ ${place + 1}`;
  $("res-reward").innerText = `+${reward} Coins 🪙`;
  try {
    const saved = localStorage.getItem("word_kart_save");
    let p = saved ? JSON.parse(saved) : { coins: 0, stage: 1 };
    p.coins = (p.coins || 0) + reward;
    if (p.stage <= stageId && stageId < 12) p.stage = stageId + 1;
    localStorage.setItem("word_kart_save", JSON.stringify(p));
  } catch (e) {}
  $("victory-modal").style.display = "flex";
}

function startBonus() {

  const offsets = [-8, 8, -14, 14, -20];
  ais.forEach((a, i) => {

  }

  if (st === "done") {
    $("b-wait").innerHTML = "🎉 ภารกิจสำเร็จ! ได้รับ N2O ไนโตรบูสต์เต็มหลอด ⚡<br>กดปุ่มด้านล่างเพื่อออกตัวลุยรอบต่อไปพร้อมกัน!";
  }
}

// ฟังก์ชันตรวจคำผิด
function fixSpelling() {
  const el = $("spell-target");
  el.innerText = bonus.m.correctWord;
  el.style.color = "#15803d";
  el.style.textDecoration = "none";
  setTimeout(handleBonusSuccess, 450);
}

// ฟังก์ชันตรวจ Wrap Text
function checkWrapOption(selected, target) {
  if (selected === target) {
    handleBonusSuccess();
  } else {
    handleBonusFail();
  }
}

// ฟังก์ชันเลือกขนาดตาราง
function selectTableSize(cols, rows) {
  document.querySelectorAll(".tbl-cell").forEach(cell => {
    const c = parseInt(cell.dataset.c);
    const r = parseInt(cell.dataset.r);
    if (c <= cols && r <= rows) cell.classList.add("sel");
    else cell.classList.remove("sel");
  });
  $("tbl-status").innerText = `เลือก: ${cols} คอลัมน์ x ${rows} แถว`;

  if (cols === bonus.m.targetCols && rows === bonus.m.targetRows) {
    setTimeout(handleBonusSuccess, 400);
  } else {
    setTimeout(handleBonusFail, 400);
  }
}

// ฟังก์ชันตรวจแท็บ Ribbon
function checkRibbonTab(selected, target) {
  if (selected.includes(target)) {
    handleBonusSuccess();
  } else {
    handleBonusFail();
  }
}

function applyInteractiveStyle(style) {
  const txt = $("sample-text");
  if (style === 'B') txt.style.fontWeight = txt.style.fontWeight === '900' ? '400' : '900';
  if (style === 'I') txt.style.fontStyle = txt.style.fontStyle === 'italic' ? 'normal' : 'italic';
  if (style === 'U') txt.style.textDecoration = txt.style.textDecoration === 'underline' ? 'none' : 'underline';

  if (style === bonus.m.target) {
    handleBonusSuccess();
  } else {
    handleBonusFail();
  }
}

function applyInteractiveAlign(align) {
  const txt = $("sample-text");
  txt.style.textAlign = align;
  if (align === bonus.m.target) {
    handleBonusSuccess();
  } else {
    handleBonusFail();
  }
}

function handleBonusSuccess() {
  bonus.ok = true;
  bonus.state = "done";
  P.gauge = 100;
  renderBonusUI();
}

function handleBonusFail() {
  bonus.state = "know";
  renderBonusUI();
}

// นับเวลาถอยหลังต่อเนื่องจนถึง 0
function tickBonus() {
  bonus.t--;
  const sec = Math.max(0, Math.ceil(bonus.t / 60));
  $("b-time").innerText = sec;
  $("b-time").classList.toggle("low", sec <= 5);

  if (bonus.t <= 0) {
    bonusEnter();
  }
}

function bonusEnter() {
  if (!bonus) return;
  if (bonus.state === "know") {
    bonus.state = "play";
    renderBonusUI();
  } else {
    bonus = null;
    $("bonus").style.display = "none";
    // ออกตัวพร้อมกัน
    startCountdown();
  }
}

$("b-retry").addEventListener("click", () => {
  if (bonus && bonus.state === "know") {
    bonus.state = "play";
    renderBonusUI();
  }
});
$("b-go").addEventListener("click", bonusEnter);

function drawRank() {
  const L = [{ n: "คุณ", s: P.lap * N + P.idx, me: 1 }, ...ais.map(a => ({ n: a.name, s: a.s }))].sort((a, b) => b.s - a.s);
  $("rank-list").innerHTML = L.map((r, i) => `<div class="rk${r.me ? " me" : ""}"><b>${i + 1}</b>${r.n}</div>`).join("");
}

const mm = $("minimap").getContext("2d");
let mnx = 1e9, mnz = 1e9, mxx = -1e9, mxz = -1e9;
pts.forEach(p => { mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x); mnz = Math.min(mnz, p.z); mxz = Math.max(mxz, p.z); });
const msc = 100 / Math.max(mxx - mnx, mxz - mnz), mp = (x, z) => [10 + (x - mnx) * msc, 10 + (z - mnz) * msc];

function drawMap() {
  mm.clearRect(0, 0, 120, 120); mm.beginPath();
  pts.forEach((p, i) => { const [x, z] = mp(p.x, p.z); i ? mm.lineTo(x, z) : mm.moveTo(x, z); });
  mm.closePath(); mm.strokeStyle = "rgba(255,255,255,.85)"; mm.lineWidth = 4; mm.stroke();
  const dot = (x, z, c, r) => { const [a, b] = mp(x, z); mm.fillStyle = c; mm.beginPath(); mm.arc(a, b, r, 0, 7); mm.fill(); };
  ais.forEach(a => { const A = pts[mod(Math.floor(a.s))]; dot(A.x, A.z, "#94a3b8", 3); });
  dot(P.x, P.z, "#facc15", 4.5);
}

function goNext() { location.href = "index.html"; }

function animate(now = 0) {
  requestAnimationFrame(animate);
  acc += Math.min(now - lastT, 100); lastT = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  items.forEach((it, i) => { if (!it.hit) { it.m.rotation.y += .04; it.m.position.y = 2 + Math.sin(frame * .06 + i) * .3; } });
  renderer.render(scene, camera);
}

const fontWait = document.fonts ? Promise.race([document.fonts.load("900 64px Kanit", "Ctrl"), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontWait.then(init, init);
</script>
</body>
