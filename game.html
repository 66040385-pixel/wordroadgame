<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Road 3D: Arcade Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800;900&family=Chakra+Petch:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #7dd3fc; position: fixed; inset: 0; font-family: 'Kanit', sans-serif; }
    #three-container { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* Top HUD */
    #top-hud {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(14px);
      border: 2px solid rgba(255,255,255,0.2); border-radius: 24px; padding: 8px 24px;
      display: flex; align-items: center; justify-content: center; gap: 16px; color: #fff; z-index: 45;
    }
    .hud-pill {
      background: linear-gradient(135deg, #f59e0b, #d97706); padding: 4px 14px;
      border-radius: 999px; font-weight: 800; font-family: 'Chakra Petch'; font-size: 0.95rem;
    }

    #mobile-controls {
      position: fixed; bottom: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 35px; pointer-events: none; z-index: 60;
    }
    .pad-cluster { pointer-events: auto; display: flex; gap: 14px; align-items: center; }
    .v-btn {
      width: 74px; height: 74px; border-radius: 22px; background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.35); display: flex; justify-content: center; align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5); cursor: pointer;
    }
    .v-btn:active { transform: scale(0.92); background: rgba(250, 204, 21, 0.35); }
    .v-btn svg { width: 34px; height: 34px; fill: #ffffff; }

    /* Modal */
    #checkpoint-modal {
      position: fixed; inset: 0; background: rgba(10, 12, 16, 0.88); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; padding: 16px; z-index: 120;
    }
    .cp-box {
      background: #ffffff; border: 4px solid #38bdf8; border-radius: 26px; padding: 24px;
      max-width: 540px; width: 100%; color: #1e293b; text-align: left;
    }
    .cp-btn-choice {
      width: 100%; padding: 12px 18px; border-radius: 14px; border: 2px solid #cbd5e1;
      background: #f8fafc; font-family: 'Kanit'; font-weight: 700; font-size: 1rem;
      cursor: pointer; margin-bottom: 8px; text-align: left; transition: 0.1s;
    }
    .cp-btn-choice:hover { background: #e0f2fe; border-color: #0284c7; }
  </style>
</head>
<body>

  <div id="three-container"></div>

  <div id="top-hud">
    <div style="font-weight:900; color:#38bdf8;" id="hud-car-name">CAR: TAXI</div>
    <div class="hud-pill" id="hud-score">ด่าน 1 / 12</div>
    <div class="hud-pill" style="background:linear-gradient(135deg, #10b981, #059669);" id="hud-coins">🪙 0</div>
  </div>

  <div id="mobile-controls">
    <div class="pad-cluster">
      <div class="v-btn" id="btn-left"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>
      <div class="v-btn" id="btn-right"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
    </div>
    <div class="pad-cluster">
      <div class="v-btn" id="btn-down" style="border-color:#ef4444;"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></div>
      <div class="v-btn" id="btn-up" style="border-color:#10b981; width:82px; height:82px;"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></div>
    </div>
  </div>

  <div id="checkpoint-modal">
    <div class="cp-box">
      <div style="font-family:'Chakra Petch'; font-size:1.2rem; font-weight:900; color:#0284c7; margin-bottom:12px;" id="cp-stage-title">CHECKPOINT</div>
      <div style="font-size:1.15rem; font-weight:800; margin-bottom:16px;" id="cp-question">โจทย์ข้อสอบ...</div>
      <div id="cp-options-list"></div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, carGroup;
    let checkpoints = [], obstacles = [], coins3D = [];
    let currentStage = 0, sessionCoins = 0, isModalOpen = false;
    let keys = { up: false, down: false, left: false, right: false };

    // สกินรถที่เลือกมาจากหน้าแรก
    let activeSkin = { name: "Taxi Yellow", color: 0xfacc15 };
    try {
      const savedSkin = localStorage.getItem("word_road_active_skin");
      if (savedSkin) activeSkin = JSON.parse(savedSkin);
    } catch(e){}

    document.getElementById("hud-car-name").innerText = `CAR: ${activeSkin.name.toUpperCase()}`;

    let carPhysics = { x: 0, z: 0, angle: 0, speed: 0, maxSpeed: 1.4, accel: 0.035, friction: 0.018, turnSpeed: 0.04 };

    const waypoints = [
      { z: -150, q: "แท็บเมนูใดใน Word รวมคำสั่งปรับขนาดฟอนต์ และจัดย่อหน้า?", target: "Home (หน้าแรก)", opts: ["Home (หน้าแรก)", "Insert", "Layout", "View"] },
      { z: -350, q: "ต้องการบันทึกงานทับไฟล์เดิมทันที กดคีย์ลัดใด?", target: "Ctrl + S", opts: ["Ctrl + S", "Ctrl + P", "Ctrl + O", "Ctrl + N"] },
      { z: -550, q: "กู้คืนข้อความที่เผลอลบหายไป (Undo) กดปุ่มใด?", target: "Ctrl + Z", opts: ["Ctrl + Z", "Ctrl + Y", "Ctrl + C", "Ctrl + V"] },
      { z: -750, q: "คีย์ลัดสำหรับทำตัวอักษรหนา (Bold) คือปุ่มใด?", target: "Ctrl + B", opts: ["Ctrl + B", "Ctrl + I", "Ctrl + U", "Ctrl + D"] },
      { z: -950, q: "จัดข้อความให้อยู่ตรงกึ่งกลางหน้ากระดาษ กดปุ่มใด?", target: "Ctrl + E", opts: ["Ctrl + E", "Ctrl + L", "Ctrl + R", "Ctrl + J"] },
      { z: -1150, q: "สร้างรายการแบบจุดกลมโดยไม่มีลำดับเลข ใช้เครื่องมือใด?", target: "Bullets", opts: ["Bullets", "Numbering", "Multilevel", "Sort"] },
      { z: -1350, q: "Wrap Text แบบใดส่งภาพไปอยู่ข้างหลังข้อความ?", target: "Behind Text", opts: ["Behind Text", "Square", "In Front of Text", "Tight"] },
      { z: -1550, q: "คำสั่งรวมช่องตารางหลายช่องเป็นช่องเดียว คือคำสั่งใด?", target: "Merge Cells", opts: ["Merge Cells", "Split Cells", "Delete", "Insert"] },
      { z: -1750, q: "ตั้งกระดาษแนวนอน ต้องเลือกแบบใดในเมนู Orientation?", target: "Landscape", opts: ["Landscape", "Portrait", "Margins", "Size"] },
      { z: -1950, q: "เส้นหยักสีแดงใต้ข้อความ เตือนข้อผิดพลาดเรื่องใด?", target: "สะกดคำผิด", opts: ["สะกดคำผิด", "เว้นวรรคผิด", "ฟอนต์ไม่รองรับ", "ลืมเซฟ"] },
      { z: -2150, q: "การทำสารบัญอัตโนมัติ ต้องตั้งสไตล์หัวข้อเป็นอะไร?", target: "Heading 1", opts: ["Heading 1", "Normal", "Title", "Quote"] },
      { z: -2350, q: "ส่งออกไฟล์ชนิดใดที่ล็อกการจัดหน้ากระดาษไม่ให้เคลื่อน?", target: ".pdf", opts: [".pdf", ".docx", ".txt", ".xlsx"] }
    ];

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7dd3fc);
      scene.fog = new THREE.Fog(0x7dd3fc, 80, 500);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById("three-container").appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xfff7ed, 0.8);
      dir.position.set(60, 100, 60);
      scene.add(dir);

      buildRoad();
      buildCar();
      buildGates();
      buildCoinsAndObstacles();
      setupControls();
      animate();
    }

    function buildRoad() {
      const roadGeo = new THREE.PlaneGeometry(32, 2800);
      const roadMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = -1200;
      scene.add(road);
    }

    function buildCar() {
      carGroup = new THREE.Group();
      // ตัวถังรถดึงสีจาก activeSkin
      const bodyGeo = new THREE.BoxGeometry(3.6, 1.3, 7.0);
      const bodyMat = new THREE.MeshLambertMaterial({ color: activeSkin.color });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 1.0;
      carGroup.add(body);

      const cabinGeo = new THREE.BoxGeometry(3.0, 1.1, 3.6);
      const cabinMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
      const cabin = new THREE.Mesh(cabinGeo, cabinMat);
      cabin.position.set(0, 1.9, -0.3);
      carGroup.add(cabin);

      scene.add(carGroup);
    }

    function buildGates() {
      waypoints.forEach((wp, idx) => {
        const gate = new THREE.Group();
        gate.position.set(0, 0, wp.z);

        const laserGeo = new THREE.PlaneGeometry(32, 14);
        const laserMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
        const laser = new THREE.Mesh(laserGeo, laserMat);
        laser.position.set(0, 7, 0);
        gate.add(laser);

        scene.add(gate);
        checkpoints.push({ laser: laser, z: wp.z, passed: false, qData: wp });
      });
    }

    function buildCoinsAndObstacles() {
      // สร้างเหรียญทอง 3D บนถนนให้ขับชนเก็บได้
      for (let z = -50; z > -2500; z -= 35) {
        const laneX = (Math.random() - 0.5) * 20;
        const coinGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 16);
        const coinMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const coin = new THREE.Mesh(coinGeo, coinMat);
        coin.rotation.x = Math.PI / 2;
        coin.position.set(laneX, 1.2, z);
        scene.add(coin);
        coins3D.push({ mesh: coin, x: laneX, z: z, collected: false });
      }
    }

    function setupControls() {
      window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = true;
        if (k === "arrowdown" || k === "s") keys.down = true;
        if (k === "arrowleft" || k === "a") keys.left = true;
        if (k === "arrowright" || k === "d") keys.right = true;
      });
      window.addEventListener("keyup", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = false;
        if (k === "arrowdown" || k === "s") keys.down = false;
        if (k === "arrowleft" || k === "a") keys.left = false;
        if (k === "arrowright" || k === "d") keys.right = false;
      });

      const bindBtn = (id, k) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[k] = true; });
        el.addEventListener("touchend", () => keys[k] = false);
      };
      bindBtn("btn-up", "up");
      bindBtn("btn-down", "down");
      bindBtn("btn-left", "left");
      bindBtn("btn-right", "right");
    }

    function update() {
      if (isModalOpen) return;

      if (keys.up) carPhysics.speed += carPhysics.accel;
      else if (keys.down) carPhysics.speed -= carPhysics.accel * 1.5;
      else {
        if (carPhysics.speed > 0) carPhysics.speed = Math.max(0, carPhysics.speed - carPhysics.friction);
        if (carPhysics.speed < 0) carPhysics.speed = Math.min(0, carPhysics.speed + carPhysics.friction);
      }
      carPhysics.speed = Math.max(-0.4, Math.min(carPhysics.speed, carPhysics.maxSpeed));

      if (carPhysics.speed !== 0) {
        const dir = carPhysics.speed > 0 ? 1 : -1;
        if (keys.left) carPhysics.angle += carPhysics.turnSpeed * dir;
        if (keys.right) carPhysics.angle -= carPhysics.turnSpeed * dir;
      }

      carPhysics.x -= Math.sin(carPhysics.angle) * carPhysics.speed;
      const nextZ = carPhysics.z - Math.cos(carPhysics.angle) * carPhysics.speed;
      carPhysics.x = Math.max(-13, Math.min(13, carPhysics.x));

      // ชนเหรียญทอง
      coins3D.forEach(c => {
        if (!c.collected && Math.hypot(carPhysics.x - c.x, carPhysics.z - c.z) < 2.5) {
          c.collected = true;
          scene.remove(c.mesh);
          sessionCoins += 10;
          document.getElementById("hud-coins").innerText = `🪙 ${sessionCoins}`;
        }
      });

      // หมุนเหรียญ
      coins3D.forEach(c => { if (!c.collected) c.mesh.rotation.z += 0.05; });

      // ชนม่านเลเซอร์
      let blocked = false;
      checkpoints.forEach((cp, idx) => {
        if (!cp.passed && carPhysics.z > cp.z && nextZ <= cp.z + 1.5) {
          blocked = true;
          carPhysics.speed = 0;
          openCheckpoint(idx);
        }
      });

      if (!blocked) carPhysics.z = nextZ;

      carGroup.position.set(carPhysics.x, 0, carPhysics.z);
      carGroup.rotation.y = carPhysics.angle;

      camera.position.set(carPhysics.x, 6.0, carPhysics.z + 14.0);
      camera.lookAt(carPhysics.x, 2.0, carPhysics.z - 8.0);
    }

    function openCheckpoint(idx) {
      isModalOpen = true;
      const cp = checkpoints[idx];
      document.getElementById("cp-stage-title").innerText = `CHECKPOINT ${idx + 1} / 12`;
      document.getElementById("cp-question").innerText = cp.qData.q;
      const list = document.getElementById("cp-options-list");
      list.innerHTML = "";

      cp.qData.opts.forEach(opt => {
        const b = document.createElement("button");
        b.className = "cp-btn-choice";
        b.innerText = opt;
        b.onclick = () => {
          if (opt === cp.qData.target) {
            alert("ยอดเยี่ยม! ปลดล็อกม่านเลเซอร์ (+50 Coins)");
            sessionCoins += 50;
            document.getElementById("hud-coins").innerText = `🪙 ${sessionCoins}`;
            cp.passed = true;
            cp.laser.material.color.setHex(0x10b981);
            cp.laser.material.opacity = 0.15;
            document.getElementById("checkpoint-modal").style.display = "none";
            isModalOpen = false;
            carPhysics.z -= 4;
            currentStage++;
            document.getElementById("hud-score").innerText = `ด่าน ${Math.min(currentStage + 1, 12)} / 12`;
          } else {
            alert("ยังไม่ถูกต้อง! ลองเลือกใหม่อีกครั้งเพื่อปลดล็อกม่านเลเซอร์");
          }
        };
        list.appendChild(b);
      });

      document.getElementById("checkpoint-modal").style.display = "flex";
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
