<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Kart 3D: Drift Circuit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&family=Kanit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #38bdf8; position: fixed; inset: 0; font-family: 'Kanit', sans-serif; }
    #three-container { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* HUD MISSION BANNER ด้านบน */
    #mission-banner {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(14px);
      border: 3px solid #38bdf8; border-radius: 24px; padding: 10px 28px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: #fff; z-index: 45; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      min-width: 330px; text-align: center;
    }
    .mission-badge { font-family: 'Chakra Petch'; font-size: 0.9rem; font-weight: 900; color: #facc15; }
    .mission-target { font-size: 1.25rem; font-weight: 900; color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }

    /* STATS & COINS */
    #stat-hud { position: fixed; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 50; }
    .hud-pill {
      background: rgba(15, 23, 42, 0.88); border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px; padding: 6px 16px; display: flex; align-items: center; gap: 8px;
      font-family: 'Chakra Petch'; font-size: 1.2rem; font-weight: 900; color: #fff;
    }

    /* SPEEDOMETER & NITRO ALERT */
    #speedo-box {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; z-index: 50; pointer-events: none;
    }
    .speed-number {
      font-family: 'Chakra Petch'; font-size: 3.2rem; font-weight: 900;
      color: #facc15; line-height: 1; text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    }
    .vehicle-tag { font-family: 'Chakra Petch'; font-weight: 900; font-size: 0.95rem; color: #38bdf8; }
    .nitro-boost-text {
      font-family: 'Chakra Petch'; font-weight: 900; font-size: 1.15rem; color: #ef4444;
      animation: flash 0.3s infinite alternate; display: none;
    }
    @keyframes flash { from { transform: scale(0.95); opacity: 0.7; } to { transform: scale(1.1); opacity: 1; } }

    /* CONTROLS */
    #mobile-controls {
      position: fixed; bottom: 25px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 28px;
      pointer-events: none; z-index: 60;
    }
    .pad-cluster { pointer-events: auto; display: flex; gap: 12px; }
    .v-btn {
      width: 76px; height: 76px; border-radius: 24px; background: rgba(15, 23, 42, 0.82);
      border: 3px solid rgba(255, 255, 255, 0.3); display: flex; justify-content: center;
      align-items: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .v-btn:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.4); border-color: #38bdf8; }
    .v-btn svg { width: 36px; height: 36px; fill: #ffffff; }

    #toast-msg {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Chakra Petch'; font-size: 2.5rem; font-weight: 900;
      color: #4ade80; text-shadow: 0 0 20px #22c55e, 0 4px 0 #000;
      pointer-events: none; z-index: 100; opacity: 0; transition: all 0.25s;
    }

    #victory-modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(14px);
      display: none; justify-content: center; align-items: center; padding: 18px; z-index: 200;
    }
    .victory-box {
      background: linear-gradient(145deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
      border: 4px solid #38bdf8; border-radius: 32px;
      padding: 30px; max-width: 460px; width: 100%; text-align: center;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.5); color: #fff;
    }
    .btn-upgrade {
      width: 100%; padding: 16px; border-radius: 18px; border: none;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #fff; font-family: 'Chakra Petch'; font-size: 1.25rem; font-weight: 900;
      cursor: pointer; box-shadow: 0 6px 0 #047857; margin-top: 18px;
    }
  </style>
</head>
<body>

  <div id="three-container"></div>

  <!-- HUD -->
  <div id="mission-banner">
    <div class="mission-badge" id="m-stage-badge">STAGE 1 / 12</div>
    <div class="mission-target" id="m-quest-text">พุ่งชน: ป้ายคำตอบ</div>
  </div>

  <div id="stat-hud">
    <div class="hud-pill" style="border-color:#f59e0b; color:#fde047;">
      <span>🪙</span>
      <span id="stat-coins">0</span>
    </div>
  </div>

  <div id="speedo-box">
    <div class="speed-number" id="speed-val">0</div>
    <div class="vehicle-tag" id="vehicle-val">BICYCLE</div>
    <div class="nitro-boost-text" id="nitro-alert">⚡ NITRO DRIFT BOOST! ⚡</div>
  </div>

  <div id="toast-msg">PERFECT HIT! ⚡</div>

  <!-- TOUCH CONTROLS -->
  <div id="mobile-controls">
    <div class="pad-cluster">
      <div class="v-btn" id="btn-left"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>
      <div class="v-btn" id="btn-right"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>
    </div>
    <div class="pad-cluster">
      <div class="v-btn" id="btn-down" style="border-color:#ef4444;"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg></div>
      <div class="v-btn" id="btn-up" style="border-color:#10b981; width:82px; height:82px;"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></div>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="victory-modal">
    <div class="victory-box">
      <h2 style="font-family:'Chakra Petch'; font-size:2rem; color:#facc15; margin:10px 0;">STAGE CLEAR!</h2>
      <p style="color:#cbd5e1; font-size:1.05rem;" id="reward-text">ยินดีด้วย! คุณผ่านภารกิจด่านนี้เรียบร้อยแล้ว</p>
      <div style="margin:16px 0; font-size:1.4rem; font-weight:900; color:#4ade80;">+100 Coins 🪙</div>
      <button class="btn-upgrade" onclick="goNext()">กลับสู่ล็อบบี้เลือกด่านต่อไป</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let stageId = parseInt(urlParams.get('stage')) || 1;

    const stageDatabase = {
      1: { type: "bicycle", name: "จักรยานเสือหมอบ", quest: "พุ่งชน: ป้ายชื่อเรื่องเอกสาร [Title Bar]", cards: [{ text: "Title Bar", ok: true, lane: 0 }, { text: "Status Bar", ok: false, lane: -8 }, { text: "Scroll Bar", ok: false, lane: 8 }] },
      2: { type: "scooter", name: "มอเตอร์ไซค์สกู๊ตเตอร์", quest: "พุ่งชน: ป้ายบันทึกด่วน [Ctrl + S]", cards: [{ text: "Ctrl + S", ok: true, lane: 8 }, { text: "Ctrl + C", ok: false, lane: -8 }, { text: "Ctrl + Z", ok: false, lane: 0 }] },
      3: { type: "kart", name: "สปอร์ตโกคาร์ต", quest: "พุ่งชน: ป้ายย้อนกลับคำสั่ง [Undo]", cards: [{ text: "Ctrl + Z", ok: true, lane: -8 }, { text: "Ctrl + Y", ok: false, lane: 0 }, { text: "Ctrl + V", ok: false, lane: 8 }] },
      4: { type: "car", name: "รถกระบะเทอร์โบ", quest: "พุ่งชน: ป้ายทำตัวอักษรหนา [Bold]", cards: [{ text: "Ctrl + B", ok: true, lane: 0 }, { text: "Ctrl + I", ok: false, lane: -8 }, { text: "Ctrl + U", ok: false, lane: 8 }] },
      5: { type: "car", name: "รถสปอร์ตเปิดประทุน", quest: "พุ่งชน: ป้ายจัดกึ่งกลางหน้ากระดาษ", cards: [{ text: "Ctrl + E", ok: true, lane: 8 }, { text: "Ctrl + L", ok: false, lane: 0 }, { text: "Ctrl + R", ok: false, lane: -8 }] },
      6: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: ป้ายหัวข้อย่อยไม่มีลำดับเลข", cards: [{ text: "Bullets", ok: true, lane: -8 }, { text: "Numbering", ok: false, lane: 0 }, { text: "Sort", ok: false, lane: 8 }] },
      7: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: ป้ายส่งภาพไปอยู่หลังตัวหนังสือ", cards: [{ text: "Behind Text", ok: true, lane: 0 }, { text: "In Front", ok: false, lane: -8 }, { text: "Square", ok: false, lane: 8 }] },
      8: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: ป้ายรวมช่องเซลล์ในตาราง", cards: [{ text: "Merge Cells", ok: true, lane: 8 }, { text: "Split Cells", ok: false, lane: 0 }, { text: "Delete", ok: false, lane: -8 }] },
      9: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: ป้ายวางกระดาษแนวนอน", cards: [{ text: "Landscape", ok: true, lane: -8 }, { text: "Portrait", ok: false, lane: 0 }, { text: "Margins", ok: false, lane: 8 }] },
      10: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: ป้ายเตือนเส้นหยักสีแดง", cards: [{ text: "สะกดคำผิด", ok: true, lane: 0 }, { text: "เว้นวรรคผิด", ok: false, lane: -8 }, { text: "ฟอนต์เพี้ยน", ok: false, lane: 8 }] },
      11: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: ป้ายสไตล์หัวข้อสร้างสารบัญ", cards: [{ text: "Heading 1", ok: true, lane: 8 }, { text: "Normal", ok: false, lane: 0 }, { text: "Title", ok: false, lane: -8 }] },
      12: { type: "car", name: "ซูเปอร์คาร์โกลด์", quest: "พุ่งชน: สกุลไฟล์ล็อกหน้ากระดาษพิมพ์", cards: [{ text: ".PDF", ok: true, lane: -8 }, { text: ".DOCX", ok: false, lane: 0 }, { text: ".TXT", ok: false, lane: 8 }] }
    };

    const cur = stageDatabase[stageId] || stageDatabase[1];

    let scene, camera, renderer, vehicleGroup;
    let coins = [], signs = [];
    let coinScore = 0, isCleared = false;
    let keys = { up: false, down: false, left: false, right: false };

    let physics = {
      x: 0, z: 0, angle: 0, speed: 0,
      baseMax: stageId === 1 ? 1.3 : (stageId <= 3 ? 1.7 : 2.2),
      accel: 0.045, friction: 0.015, turnSpeed: 0.045, boostTimer: 0
    };

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.Fog(0x38bdf8, 100, 600);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1200);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById("three-container").appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x334155, 0.95);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xfffbeb, 0.95);
      sun.position.set(60, 120, 60);
      sun.castShadow = true;
      scene.add(sun);

      buildKartDriftTrack();
      buildVehicle(cur.type);
      buildItems();
      setupInputs();

      document.getElementById("m-stage-badge").innerText = `STAGE ${stageId} / 12`;
      document.getElementById("m-quest-text").innerText = cur.quest;
      document.getElementById("vehicle-val").innerText = cur.name;

      animate();
    }

    /* สร้างสนามแข่ง KART RIDER DRIFT CIRCUIT พร้อมขอบทางแถบแดงขาว & โครงสร้างข้างสนาม */
    function buildKartDriftTrack() {
      // 1. พื้นหญ้าด้านนอกสนาม
      const grassGeo = new THREE.PlaneGeometry(600, 2000);
      const grassMat = new THREE.MeshLambertMaterial({ color: 0x16a34a });
      const grass = new THREE.Mesh(grassGeo, grassMat);
      grass.rotation.x = -Math.PI / 2;
      grass.position.z = -600;
      scene.add(grass);

      // 2. ถนนสนามแข่งแอสฟัลต์สีเข้ม (กว้าง 34 เมตร)
      const roadGeo = new THREE.PlaneGeometry(34, 1800);
      const roadMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.set(0, 0.05, -600);
      scene.add(road);

      // 3. ขอบทางโค้งสนามแข่งแบบสากล (Racing Curbs แถบแดง-ขาว)
      for (let z = 50; z > -1500; z -= 12) {
        const curbColor = (Math.abs(Math.floor(z / 12)) % 2 === 0) ? 0xef4444 : 0xffffff;
        const curbMat = new THREE.MeshLambertMaterial({ color: curbColor });
        const curbGeo = new THREE.BoxGeometry(2.2, 0.4, 12);

        // ขอบซ้าย
        const leftCurb = new THREE.Mesh(curbGeo, curbMat);
        leftCurb.position.set(-18.1, 0.2, z);
        scene.add(leftCurb);

        // ขอบขวา
        const rightCurb = new THREE.Mesh(curbGeo, curbMat);
        rightCurb.position.set(18.1, 0.2, z);
        scene.add(rightCurb);
      }

      // 4. เส้นแบ่งเลนสีเหลืองสะท้อนแสงตรงกลางถนน
      for (let z = 50; z > -1500; z -= 15) {
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const lineGeo = new THREE.PlaneGeometry(0.4, 6);
        const l1 = new THREE.Mesh(lineGeo, lineMat);
        l1.rotation.x = -Math.PI / 2;
        l1.position.set(-5.5, 0.08, z);
        scene.add(l1);

        const l2 = l1.clone();
        l2.position.x = 5.5;
        scene.add(l2);
      }

      // 5. ซุ้มประตูปล่อยตัว KartRider & เสาไฟสปอร์ตไลท์สนามแข่ง
      buildTrackProps();
    }

    function buildTrackProps() {
      // ซุ้มประตูโครงเหล็ก Start / Sponsor Gantry
      const gantryZ = -30;
      const poleGeo = new THREE.BoxGeometry(1.5, 15, 1.5);
      const poleMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
      
      const p1 = new THREE.Mesh(poleGeo, poleMat);
      p1.position.set(-18, 7.5, gantryZ);
      scene.add(p1);

      const p2 = p1.clone();
      p2.position.x = 18;
      scene.add(p2);

      const beamGeo = new THREE.BoxGeometry(38, 2.5, 2);
      const beamMat = new THREE.MeshLambertMaterial({ color: 0x38bdf8 });
      const beam = new THREE.Mesh(beamGeo, beamMat);
      beam.position.set(0, 14, gantryZ);
      scene.add(beam);

      // ต้นไม้และเสาไฟประดับสองข้างทาง
      for (let z = 0; z > -1400; z -= 80) {
        createTrackTree(-24, z);
        createTrackTree(24, z);
        createFloodlight(-21, z + 40);
        createFloodlight(21, z + 40);
      }
    }

    function createTrackTree(x, z) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 5), new THREE.MeshLambertMaterial({ color: 0x78350f }));
      trunk.position.set(x, 2.5, z);
      scene.add(trunk);

      const leaves = new THREE.Mesh(new THREE.ConeGeometry(3.5, 8, 8), new THREE.MeshLambertMaterial({ color: 0x15803d }));
      leaves.position.set(x, 8, z);
      scene.add(leaves);
    }

    function createFloodlight(x, z) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 14), new THREE.MeshLambertMaterial({ color: 0x64748b }));
      pole.position.set(x, 7, z);
      scene.add(pole);

      const lightBox = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 1), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
      lightBox.position.set(x, 14, z);
      lightBox.rotation.y = x > 0 ? -0.4 : 0.4;
      scene.add(lightBox);
    }

    /* โมเดลยานพาหนะตามด่าน */
    function buildVehicle(type) {
      vehicleGroup = new THREE.Group();

      if (type === "bicycle") {
        // โมเดลจักรยานเสือหมอบ (Bicycle)
        const frameMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111827 });

        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.3, 3.4), frameMat);
        frame.position.y = 1.3;
        vehicleGroup.add(frame);

        const wGeo = new THREE.CylinderGeometry(0.85, 0.85, 0.22, 16);
        const w1 = new THREE.Mesh(wGeo, wheelMat);
        w1.rotation.z = Math.PI / 2;
        w1.position.set(0, 0.85, -1.4);
        vehicleGroup.add(w1);

        const w2 = w1.clone();
        w2.position.set(0, 0.85, 1.4);
        vehicleGroup.add(w2);
      } else {
        // โมเดลโกคาร์ต / รถสปอร์ต
        const carMat = new THREE.MeshLambertMaterial({ color: stageId > 5 ? 0xfacc15 : 0xef4444 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.1, 6.5), carMat);
        body.position.y = 0.9;
        vehicleGroup.add(body);

        const spoiler = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.3, 0.8), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
        spoiler.position.set(0, 1.8, 2.7);
        vehicleGroup.add(spoiler);
      }

      scene.add(vehicleGroup);
    }

    function createSignBoard(text, ok) {
      const canvas = document.createElement("canvas");
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = ok ? "#059669" : "#dc2626";
      ctx.roundRect(0, 0, 256, 128, 20);
      ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 6; ctx.stroke();
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 32px Kanit";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 64);

      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.Mesh(new THREE.PlaneGeometry(6.5, 3.5), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
    }

    function buildItems() {
      for (let z = -40; z > -420; z -= 30) {
        const lane = [-8, 0, 8][Math.floor(Math.random() * 3)];
        const coin = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.25, 16), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
        coin.rotation.x = Math.PI / 2;
        coin.position.set(lane, 1.2, z);
        scene.add(coin);
        coins.push({ mesh: coin, x: lane, z: z, hit: false });
      }

      cur.cards.forEach(c => {
        const sign = createSignBoard(c.text, c.ok);
        sign.position.set(c.lane, 2.3, -460);
        scene.add(sign);
        signs.push({ mesh: sign, x: c.lane, z: -460, ok: c.ok, hit: false });
      });
    }

    function setupInputs() {
      window.addEventListener("keydown", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = true;
        if (k === "arrowdown" || k === "s") keys.down = true;
        if (k === "arrowleft" || k === "a") keys.left = true;
        if (k === "arrowright" || k === "d") keys.right = true;
      });
      window.addEventListener("keyup", e => {
        const k = e.key.toLowerCase();
        if (k === "arrowup" || k === "w") keys.up = false;
        if (k === "arrowdown" || k === "s") keys.down = false;
        if (k === "arrowleft" || k === "a") keys.left = false;
        if (k === "arrowright" || k === "d") keys.right = false;
      });

      const bind = (id, act) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[act] = true; });
        el.addEventListener("touchend", () => keys[act] = false);
      };
      bind("btn-up", "up"); bind("btn-down", "down"); bind("btn-left", "left"); bind("btn-right", "right");
    }

    function showToast(text, color) {
      const t = document.getElementById("toast-msg");
      t.innerText = text; t.style.color = color; t.style.opacity = "1";
      setTimeout(() => { t.style.opacity = "0"; }, 750);
    }

    function update() {
      if (isCleared) return;

      let curMax = physics.baseMax;
      if (physics.boostTimer > 0) {
        physics.boostTimer--;
        curMax *= 1.45;
        document.getElementById("nitro-alert").style.display = "block";
      } else {
        document.getElementById("nitro-alert").style.display = "none";
      }

      if (keys.up) physics.speed += physics.accel;
      else if (keys.down) physics.speed -= physics.accel * 1.5;
      else {
        if (physics.speed > 0) physics.speed = Math.max(0, physics.speed - physics.friction);
        if (physics.speed < 0) physics.speed = Math.min(0, physics.speed + physics.friction);
      }
      physics.speed = Math.max(-0.3, Math.min(physics.speed, curMax));

      if (physics.speed !== 0) {
        const dir = physics.speed > 0 ? 1 : -1;
        if (keys.left) physics.angle += physics.turnSpeed * dir;
        if (keys.right) physics.angle -= physics.turnSpeed * dir;
      }

      physics.x -= Math.sin(physics.angle) * physics.speed;
      physics.z -= Math.cos(physics.angle) * physics.speed;
      physics.x = Math.max(-14, Math.min(14, physics.x));

      coins.forEach(c => {
        if (!c.hit && Math.hypot(physics.x - c.x, physics.z - c.z) < 2.5) {
          c.hit = true;
          scene.remove(c.mesh);
          coinScore += 10;
          document.getElementById("stat-coins").innerText = coinScore;
        }
      });

      signs.forEach(s => {
        if (!s.hit && Math.hypot(physics.x - s.x, physics.z - s.z) < 3.2) {
          s.hit = true;
          scene.remove(s.mesh);

          if (s.ok) {
            physics.boostTimer = 80;
            showToast("PERFECT HIT! ⚡ NITRO BOOST", "#4ade80");
            setTimeout(completeStage, 1000);
          } else {
            showToast("WRONG TARGET! 💥", "#ef4444");
            physics.speed *= 0.35;
          }
        }
      });

      vehicleGroup.position.set(physics.x, 0, physics.z);
      vehicleGroup.rotation.y = physics.angle;

      camera.position.set(physics.x, 5.5, physics.z + 13.0);
      camera.lookAt(physics.x, 1.6, physics.z - 8.0);

      document.getElementById("speed-val").innerText = Math.round(Math.abs(physics.speed) * 65);
    }

    function completeStage() {
      isCleared = true;
      try {
        const saved = localStorage.getItem("word_kart_save");
        let p = saved ? JSON.parse(saved) : { coins: 0, stage: 1 };
        p.coins = (p.coins || 0) + coinScore + 100;
        if (p.stage <= stageId && stageId < 12) p.stage = stageId + 1;
        localStorage.setItem("word_kart_save", JSON.stringify(p));
      } catch(e){}

      document.getElementById("victory-modal").style.display = "flex";
    }

    function goNext() {
      window.location.href = `index.html`;
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      coins.forEach(c => { if (!c.hit) c.mesh.rotation.z += 0.05; });
      renderer.render(scene, camera);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
